server:
  port: 8080

spring:
  application:
    name: medlabs-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medlabs}
    username: ${DB_USERNAME:medlabs}
    password: ${DB_PASSWORD:medlabs}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/medlabs}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/realms/medlabs/protocol/openid-connect/certs}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
