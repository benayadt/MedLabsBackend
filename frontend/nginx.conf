server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the built SPA files; fall back to index.html for client-side
    # routing (e.g. /patients/123 should still load the app shell).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API access: the browser calls /api/... on this origin,
    # and Nginx forwards it to the gateway container over the internal
    # Docker network. This removes the need for CORS in production.
    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
