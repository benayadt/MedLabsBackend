version: '3.9'

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medlabs-web
    ports:
      - "8000:80"
    depends_on:
      - gateway
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: medlabs-gateway
    ports:
      - "8080:8080"
    environment:
      MEDLABS_API_URL: http://api:8080
      JWT_ISSUER_URI: http://localhost:8081/realms/medlabs
      JWT_JWK_SET_URI: http://keycloak:8081/realms/medlabs/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      - api
      - keycloak
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medlabs-api
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/medlabs
      DB_USERNAME: medlabs
      DB_PASSWORD: medlabs
      JWT_ISSUER_URI: http://localhost:8081/realms/medlabs
      JWT_JWK_SET_URI: http://keycloak:8081/realms/medlabs/protocol/openid-connect/certs
    depends_on:
      - db
      - keycloak
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: medlabs-db
    environment:
      POSTGRES_DB: medlabs
      POSTGRES_USER: medlabs
      POSTGRES_PASSWORD: medlabs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: medlabs-keycloak
    command: start-dev --http-port=8081 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    restart: unless-stopped

volumes:
  postgres_data:
