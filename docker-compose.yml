version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medlabs-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/medlabs
      DB_USERNAME: medlabs
      DB_PASSWORD: medlabs
      JWT_ISSUER_URI: http://keycloak:8081/realms/medlabs
    depends_on:
      - db
      - keycloak
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: medlabs-db
    environment:
      POSTGRES_DB: medlabs
      POSTGRES_USER: medlabs
      POSTGRES_PASSWORD: medlabs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: medlabs-keycloak
    command: start-dev --http-port=8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  postgres_data:
