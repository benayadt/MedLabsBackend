server:
  port: 8080

spring:
  application:
    name: medlabs-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
            allow-credentials: true
      routes:
        - id: medlabs-api
          uri: ${MEDLABS_API_URL}
          predicates:
            - Path=/api/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/medlabs}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/realms/medlabs/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health
